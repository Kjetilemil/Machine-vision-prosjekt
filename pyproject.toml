[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mv-editor"
version = "0.1.0"
description = "Photo editor with face retouching and age-estimation feedback loop (IKT213)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.7",
    "opencv-contrib-python>=4.10",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
vision = [
    "onnxruntime>=1.18",
    "insightface>=0.7.3",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mv-editor = "mv_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]